<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand-blue rounded square -->
  <rect width="64" height="64" rx="10" fill="#1E4993"/>

  <!-- The "T" letter is the first subpath of the wordmark's "Turnfest"
       group in assets/logo ersatzturnfest 2026 im wegenstettertal.svg.
       A nested <svg> with a viewBox cropped around that letter lets us
       reuse the exact path + its parent transform without any maths. -->
  <svg x="9" y="6" width="46" height="46" viewBox="195 175 310 380" preserveAspectRatio="xMidYMid meet">
    <g transform="matrix(10.881837,0,0,10.881837,-4287.560975,-6056.843601)">
      <path d="M416.753,607.102L421.402,580.774L412.552,580.774L413.802,573.524L439.852,573.524L438.602,580.774L429.702,580.774L425.2,606.266L416.753,607.102Z" fill="#ffffff"/>
    </g>
  </svg>

  <!-- Orange underline echoing the bar under the wordmark on the flyer -->
  <rect x="14" y="51" width="36" height="6" rx="2" fill="#FA9E0F"/>
</svg>
